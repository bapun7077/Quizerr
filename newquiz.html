<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="indexStyle.css">
</head>

<body>
    <header class="d-flex flex-wrap justify-content-center border-bottom"> 
        <a href="index.html" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
            <span class="website-logo">Quizerr</span> 
        </a>
        <ul class="nav nav-pills align-items-center">
            <li class="nav-item"><a href="index.html" class="nav-link" aria-current="page">Home</a></li>
            <li class="nav-item"><a href="newquiz.html" class="nav-link active">Quiz</a></li>
            <li class="nav-item"><a href="#" class="nav-link">Dashboard</a></li>
            <li class="nav-item"><a href="#" class="nav-link">Mode</a></li>
        </ul>
    </header>   
    
    <main class="quiz-container">
        <div class="page-container">
            <h1>Configure Your Quiz</h1>
            <p class="subtitle">Choose a category and difficulty to get 10 tailored questions</p>

            <div class="config-card">
                <div class="setting-group">
                    <label>Category</label>
                    <select class="dropdown">
                        <option>Any Tech Category</option>
                        <option value="cs">Computer Science</option>
                        <option value="gadgets">Gadgets</option>
                        <option value="gk">General Knowledge</option>
                        <option value="film">Film</option>
                        <option value="games">Games</option>
                        <option value="trending">Trending</option>
                    </select>
                </div>

                <div class="setting-group">
                    <label>Difficulty</label>
                    <div class="button-group">
                        <button class="btn-primary-outline" id="anyDifficulty">Any Difficulty</button>
                        <button class="btn-secondary" id="easy">Easy</button>
                        <button class="btn-secondary" id="medium">Medium</button>
                        <button class="btn-secondary" id="hard">Hard</button>
                    </div>
                </div>

                <div class="summary-box">
                    <div class="summary-item">
                        <span>Questions</span>
                        <span class="value">10</span>
                    </div>
                    <div class="summary-item">
                        <span>Time per question</span>
                        <span class="value">20 seconds</span>
                    </div>
                    <div class="summary-item">
                        <span>Type</span>
                        <span class="value">Multiple choice</span>
                    </div>
                </div>

                <button class="start-btn"><i class="bi bi-caret-right-fill"></i> Start Quiz</button>
            </div>
        </div>
    </main>

    <script src="index.js"></script>
</body>

</html>
