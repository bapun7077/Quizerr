<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz — Quizerr</title>
    <meta name="description" content="Answer 10 timed multiple-choice questions and test your knowledge on Quizerr.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="indexStyle.css">
</head>

<body>
    <header class="d-flex flex-wrap justify-content-center border-bottom"> 
        <a href="index.html" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
            <span class="website-logo">Quizerr</span> 
        </a>
        <ul class="nav nav-pills align-items-center">
            <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
            <li class="nav-item"><a href="newquiz.html" class="nav-link active">Quiz</a></li>
            <li class="nav-item"><a href="dashboard.html" class="nav-link">Dashboard</a></li>
            <li class="nav-item"><button class="mode-toggle" onclick="toggleDarkMode()"><i class="bi bi-moon-stars-fill"></i> Dark</button></li>
        </ul>
    </header>

    <main class="quiz-container">
        <div class="page-container" style="max-width: 800px;">

            <!-- Progress Section -->
            <div class="quiz-progress-section">
                <div class="progress-header">
                    <div class="quiz-info">
                        <span class="quiz-badge" id="quiz-category">Category</span>
                        <span class="quiz-badge" id="quiz-difficulty">Difficulty</span>
                    </div>
                    <div class="timer-wrapper">
                        <div class="timer-circle">
                            <svg viewBox="0 0 60 60">
                                <circle class="timer-bg" cx="30" cy="30" r="26"></circle>
                                <circle class="timer-progress" id="timer-progress" cx="30" cy="30" r="26"
                                    stroke-dasharray="163.36" stroke-dashoffset="0"></circle>
                            </svg>
                            <span class="timer-value" id="timer-value">20</span>
                        </div>
                        <span class="timer-label">seconds</span>
                    </div>
                </div>
                <div class="progress-text">
                    Question <span id="current-q">1</span> of <span id="total-q">10</span>
                </div>
                <div class="progress-bar-track">
                    <div class="progress-bar-fill" id="progress-fill" style="width: 10%;"></div>
                </div>
            </div>

            <!-- Question Card -->
            <div class="question-card" id="question-card">
                <div class="question-number" id="question-number">Question 1</div>
                <div class="question-text" id="question-text">Loading question...</div>
            </div>

            <!-- Answers Grid -->
            <div class="answers-grid" id="answers-grid">
                <!-- Dynamically populated by quiz.js -->
            </div>

            <!-- Next Button -->
            <button class="next-btn" id="next-btn">
                Next Question <i class="bi bi-arrow-right"></i>
            </button>
        </div>
    </main>

    <script src="quiz.js"></script>
    <script src="darkmode.js"></script>
</body>

</html>
